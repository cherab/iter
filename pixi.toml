[workspace]
channels = ["conda-forge", "https://prefix.dev/koyo-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]
preview = ["pixi-build"]

[workspace.build-variants]
python = ["3.10.*", "3.11.*", "3.12.*", "3.13.*", "3.14.*"]

# -------------------------------
# === Packaging Configuration ===
# -------------------------------
[package]
version = "dynamic"  # Until pixi recommends something else

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[package.build.config]
noarch = false

[package.host-dependencies]
python = "*"
hatch-cython = ">=0.6.0"
hatch-vcs = "*"
cython = ">=3.1,<4"
cherab = "1.5.*"

[package.run-dependencies]
cherab-imas = "*"
platformdirs = "*"
rich = "*"
plotly = "*"

# ---------------------------------
# === Development Configuration ===
# ---------------------------------
[dev]
cherab-iter = { path = "." }

[dependencies]
cherab-iter = { path = "." }
ipython = "*"

# Type stubs for static type checking
cherab-stubs = "*"

# For inversion weighted sum
cherab-inversion = "*"

# For notebook demos
jupyterlab = "*"
ipywidgets = "*"
xarray = "*"
netcdf4 = ">=1.7.2,<2"
pyvista = "*"
trame = "*"
trame-vtk = "*"
trame-vuetify = "*"
trame-pvui = "*"
hvplot = ">=0.11.2,<0.12"
jupyter_bokeh = ">=4.0.5,<5"
panel = ">=1.6.2,<2"
python-kaleido = "*"

# Publication-quality plotting
ultraplot = ">=1.72.0"

[activation.env]
# UDA environment variables
UDA_PORT = "56565"
UDA_HOST = "uda.iter.org"
UDA_CLIENT_SSL_KEY = "$PIXI_PROJECT_ROOT/.uda/private.key"
UDA_CLIENT_CA_SSL_CERT = "$PIXI_PROJECT_ROOT/.uda/ca-server-certificate.pem"
UDA_CLIENT_SSL_CERT = "$PIXI_PROJECT_ROOT/.uda/certificate.pem"
UDA_CLIENT_SSL_AUTHENTICATE = "1"

[tasks]
ipython = { cmd = "ipython", description = "🐍 Start an IPython shell" }
lab = {
  cmd = [
    "jupyter",
    "lab",
    "--notebook-dir",
    "demos",
  ],
  description = "🚀 Run JupyterLab"
}

# === Tests feature ===
[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"

[feature.test.tasks]
test = { cmd = ["pytest", "tests"], description = "🧪 Run the tests" }

# === Docs feature ===
[feature.docs.dependencies]
sphinx = ">=7,<8.2"
sphinx-copybutton = "*"
sphinx-codeautolink = "*"
sphinx-design = "*"
sphinx-immaterial = "*"
linkify-it-py = "*"
myst-parser = "*"

# For notebook support
ipykernel = "*"
ipywidgets = "*"
nbsphinx = "*"
pandoc = "*"

[feature.docs.pypi-dependencies]
sphinx-github-style = "*"
sphinx-api-relink = "*"

[feature.docs.tasks]
doc-build = {
  cmd = [
    "sphinx-build",
    "-b",
    "{{ target }}",
    "-j",
    "auto",
    "source",
    "build/{{ target }}",
  ],
  cwd = "docs",
  args = [
    { arg = "target", default = "html" },
  ],
  description = "📝 Build the docs"
}
doc-serve = {
  cmd = [
    "python",
    "-m",
    "http.server",
    "8000",
    "--directory",
    "build/html",
  ],
  cwd = "docs",
  description = "🚀 Start a local server for the docs"
}

# === Linting feature ===
[feature.lint.dependencies]
dprint = "*"
lefthook = "*"
ruff = "*"
typos = "*"
mypy = "*"
pyrefly = "*"
actionlint = "*"
shellcheck = "*"
validate-pyproject = "*"
cython-lint = "*"
blacken-docs = "*"
tombi = "*"

[feature.lint.tasks]
lefthook = { cmd = "lefthook", description = "🔗 Run lefthook" }
hooks = { cmd = "lefthook install", description = "🔗 Install pre-commit hooks" }
pre-commit = { cmd = "lefthook run pre-commit", description = "🔗 Run pre-commit checks" }
mypy = { cmd = "mypy", description = "Type check with mypy" }
pyrefly-check = { cmd = "pyrefly check", description = "Type check with pyrefly" }
ruff-check = { cmd = "ruff check --fix", description = "Lint with ruff" }
ruff-format = { cmd = "ruff format", description = "Format with ruff" }
toml-format = { cmd = "tombi format", description = "Format TOML files" }
dprint = { cmd = "dprint fmt", description = "Format with dprint" }
typos = { cmd = "typos --write-changes --force-exclude", description = "Fix typos" }
actionlint = { cmd = "actionlint", description = "Lint actions with actionlint" }
blacken-docs = { cmd = "blacken-docs", description = "Format Python markdown blocks with Black" }
validate-pyproject = { cmd = "validate-pyproject pyproject.toml", description = "Validate pyproject.toml" }
cython-lint = { cmd = "cython-lint", description = "Lint Cython files" }
lint = { cmd = "lefthook run pre-commit --all-files --force", description = "🧹 Run all linters" }

[feature.tools.tasks]
clean = {
  cmd = "find src -type f \\( -name '*.c' -o -name '*.so' -o -name '*.pyd' -o -name '*.dll' \\) -delete",
  description = "🧹 Clean build artifacts",
}

doc-clean = {
  cmd = ["rm", "-rf", "build/{{ target }}", "source/_api"],
  cwd = "docs",
  args = [
    { arg = "target", default = "html" },
  ],
  description = "🔥 Clean the docs build & api directory"
}

# === Python environment features ===
[feature.pyoldest.dependencies]
python = "3.10.*"

[feature.pylatest.dependencies]
python = "3.14.*"

[environments]
default = { features = ["pylatest"], solve-group = "pylatest" }
docs = { features = ["pylatest", "docs"], solve-group = "pylatest" }
test = { features = ["pylatest", "test"], solve-group = "pylatest" }
test-pyoldest = ["pyoldest", "test"]
test-pylatest = { features = ["pylatest", "test"], solve-group = "pylatest" }  # alias of test
lint = ["lint", "test"]
tools = { features = ["tools"], no-default-feature = true }
